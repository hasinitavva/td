<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toggle Switch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 50px 60px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      min-width: 340px;
    }

    h2 {
      color: #e0e0ff;
      font-size: 22px;
      margin-bottom: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(130,100,255,0.5);
    }

    p.subtitle {
      color: #a0a8d0;
      font-size: 13px;
      margin-bottom: 36px;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 36px;
    }

    .toggle-label {
      font-size: 15px;
      font-weight: 600;
      color: #a0a8d0;
      transition: color 0.3s;
      min-width: 50px;
    }

    .toggle-label.active {
      color: #ffffff;
    }

    #toggleInput {
      display: none;
    }

    .switch {
      position: relative;
      width: 70px;
      height: 34px;
      cursor: pointer;
    }

    .switch .track {
      position: absolute;
      inset: 0;
      background: #3a3a5c;
      border-radius: 34px;
      transition: background 0.4s;
      border: 2px solid rgba(255,255,255,0.1);
    }

    .switch .knob {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 22px;
      height: 22px;
      background: #ffffff;
      border-radius: 50%;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    #toggleInput:checked + .switch .track {
      background: linear-gradient(135deg, #8264ff, #5a3fcf);
      border-color: rgba(130,100,255,0.4);
      box-shadow: 0 0 14px rgba(130,100,255,0.5);
    }

    #toggleInput:checked + .switch .knob {
      transform: translateX(36px);
    }

    .output-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px 30px;
      margin-bottom: 24px;
      transition: all 0.4s ease;
    }

    .output-box.on {
      border-color: rgba(130,100,255,0.5);
      box-shadow: 0 0 20px rgba(130,100,255,0.2);
      background: rgba(130,100,255,0.08);
    }

    .output-text {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      transition: all 0.4s ease;
      color: #555588;
    }

    .output-text.on {
      color: #a98fff;
      text-shadow: 0 0 16px rgba(130,100,255,0.6);
    }

    .status-badge {
      display: inline-block;
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.4s;
      background: rgba(255,255,255,0.05);
      color: #666699;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .status-badge.on {
      background: linear-gradient(135deg, #8264ff, #5a3fcf);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(130,100,255,0.4);
    }

    .counter {
      margin-top: 20px;
      font-size: 13px;
      color: #666699;
    }

    .counter span {
      color: #a98fff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚡ Toggle Switch</h2>
    <p class="subtitle">Click the switch to toggle the output text</p>

    <div class="toggle-container">
      <span class="toggle-label active" id="offLabel">OFF</span>

      <input type="checkbox" id="toggleInput" onchange="handleToggle()">
      <label class="switch" for="toggleInput">
        <span class="track"></span>
        <span class="knob"></span>
      </label>

      <span class="toggle-label" id="onLabel">ON</span>
    </div>

    <div class="output-box" id="outputBox">
      <div class="output-text" id="outputText">🔴 Switch is OFF</div>
    </div>

    <div class="status-badge" id="statusBadge">Inactive</div>

    <div class="counter">
      Toggled <span id="clickCount">0</span> time(s)
    </div>
  </div>

  <script>
    let clickCount = 0;

    function handleToggle() {
      const checkbox   = document.getElementById('toggleInput');
      const outputText = document.getElementById('outputText');
      const outputBox  = document.getElementById('outputBox');
      const badge      = document.getElementById('statusBadge');
      const offLabel   = document.getElementById('offLabel');
      const onLabel    = document.getElementById('onLabel');
      const counter    = document.getElementById('clickCount');

      clickCount++;
      counter.textContent = clickCount;

      if (checkbox.checked) {
        outputText.textContent = '🟢 Switch is ON';
        outputText.classList.add('on');
        outputBox.classList.add('on');
        badge.textContent = 'Active';
        badge.classList.add('on');
        offLabel.classList.remove('active');
        onLabel.classList.add('active');
      } else {
        outputText.textContent = '🔴 Switch is OFF';
        outputText.classList.remove('on');
        outputBox.classList.remove('on');
        badge.textContent = 'Inactive';
        badge.classList.remove('on');
        offLabel.classList.add('active');
        onLabel.classList.remove('active');
      }
    }
  </script>

</body>
</html>
